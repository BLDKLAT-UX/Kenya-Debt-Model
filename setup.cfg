[flake8]
max-line-length = 100
ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    outputs,
    logs

[isort]
profile = black
line_length = 100

[tool:pytest]
testpaths = tests
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
