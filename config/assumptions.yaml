# =============================================================================
# Kenya Debt Sustainability Analysis Model — Master Assumptions File
# =============================================================================
# All input data lives here. Edit this file to update the model.
# Python scripts read from this file — never hardcode data in src/ files.
#
# Structure:
#   meta        — model metadata
#   years       — fiscal year labels and projection boundary
#   real_sector — GDP, growth, inflation, exchange rate
#   external    — exports, imports, FDI, reserves, remittances
#   rates       — CBR, T-bill, bond yields, concessional rates
#   debt_stock  — domestic, external, guaranteed portfolio
#   fiscal      — revenue, expenditure, balances
#   thresholds  — IMF LIC-DSF stress thresholds
# =============================================================================

meta:
  country: Kenya
  currency: KES
  unit: Billions
  base_year: "FY2024/25"
  projection_start: "FY2025/26"
  framework: IMF LIC-DSF 2018
  policy_space: Strong
  classification: "Sustainable but at High Risk"
  prepared_by: Public Debt Management Office (PDMO)
  last_updated: "September 2026"

# ── Fiscal Year Labels
years:
  labels:
    - "FY22/23"
    - "FY23/24"
    - "FY24/25"
    - "FY25/26"
    - "FY26/27"
    - "FY27/28"
    - "FY28/29"
    - "FY29/30"
  integers: [2023, 2024, 2025, 2026, 2027, 2028, 2029, 2030]
  projection_from_index: 3   # FY25/26 onwards are projections (0-indexed)

