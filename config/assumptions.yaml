  interest_revenue_pct:     20.0
  atm_domestic_years:       4.0
  refinancing_risk_pct:     20.0
  fx_share_pct:             50.0

# ── G. Stress Test Scenarios (Debt/GDP %, DS/Rev %, PV Ext/GDP %, Primary/GDP %)
