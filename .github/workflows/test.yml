name: Kenya Debt Model — CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 src/ utils/ --max-line-length=100 --ignore=E203,W503

      - name: Check formatting with black
        run: |
          black --check src/ utils/ tests/ --line-length=100

      - name: Check import order with isort
        run: |
          isort --check-only src/ utils/ tests/ --profile=black

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short --cov=src --cov=utils \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build-check:
    name: Build Outputs Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate all outputs
        run: python run_all.py --no-dash

      - name: Verify output files exist
        run: |
          test -f outputs/Kenya_Debt_Model.xlsx && echo "Excel OK"
          test -f outputs/Kenya_Debt_Report.pdf  && echo "PDF OK"
          test -f outputs/Kenya_Sensitivity.xlsx && echo "Sensitivity OK"

      - name: Upload outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-outputs
          path: outputs/
          retention-days: 30
